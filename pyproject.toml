[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app"                             # the import name
version = "0.1.0"
description = "Lightweight interactive scientific/engineering simulator (mass-spring-damper first)"
readme = "README.md"                     # optional for now
requires-python = ">=3.10"
dependencies = [
    # runtime dependencies will go here later
    # "numpy>=1.26",
    # "scipy>=1.11",
    # "fastapi>=0.110",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]                          # tells setuptools to look inside src/

[tool.pytest.ini_options]
pythonpath = ["src"]                     # so tests can do "from app.physics_utils import ..."
testpaths = ["tests"]
